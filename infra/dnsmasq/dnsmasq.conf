# =====================================================================
# dnsmasq — servidor DHCP + DNS da rede vinheria-net (172.30.0.0/24)
# =====================================================================
#
# Plano de endereçamento:
#   172.30.0.1          gateway da bridge do Docker
#   172.30.0.2 – .63    servidores de infraestrutura com IP fixo (DNS, banco)
#   172.30.0.64 – .127  IPs internos atribuídos pelo Docker (publicação de portas)
#   172.30.0.200 – .250 faixa DHCP para os serviços de aplicação
#
# Os serviços pedem IP por DHCP informando o próprio nome (opção 12, hostname).
# O dnsmasq registra esse nome automaticamente no DNS: identidade -> identidade.vinheria.local

# ---------------------------- DNS ------------------------------------
domain=vinheria.local
# Nomes .vinheria.local são respondidos só daqui (nunca encaminhados para fora)
local=/vinheria.local/
# Não lê o /etc/hosts do container; os registros fixos estão abaixo
no-hosts
# Não encaminha nomes sem domínio nem endereços privados reversos para a internet
domain-needed
bogus-priv

# Registros fixos (servidores de infraestrutura)
host-record=gateway.vinheria.local,172.30.0.1
host-record=dns.vinheria.local,172.30.0.2
host-record=db.vinheria.local,172.30.0.10

# ---------------------------- DHCP -----------------------------------
dhcp-range=172.30.0.200,172.30.0.250,255.255.255.0,12h
dhcp-option=option:router,172.30.0.1
dhcp-option=option:dns-server,172.30.0.2
dhcp-option=option:domain-name,vinheria.local
dhcp-option=option:domain-search,vinheria.local
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# ---------------------------- Logs -----------------------------------
# DISCOVER/OFFER/REQUEST/ACK e consultas DNS aparecem em: docker logs vinheria-dns
log-dhcp
log-queries
log-facility=-
